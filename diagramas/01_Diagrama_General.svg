<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="1480px" version="1.1" viewBox="0 0 2050 1480" width="2050px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F5F7FA" height="1480" width="2050" x="0" y="0" /><rect fill="#13243B" height="142" width="2050" x="0" y="0" /><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="38" font-weight="bold" text-anchor="start" x="58" y="72">PARQUEO AUTOMATICO — ESQUEMA GENERAL</text><text fill="#B4C7D8" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="start" x="60" y="112">Todos los pines indicados son GPIO reales del ESP32 y pines digitales del Arduino UNO</text><rect fill="white" height="251" rx="18" stroke="#DDE4EC" stroke-width="2" width="840" x="70" y="192" /><rect fill="#236BB4" height="251" rx="4" width="8" x="70" y="192" /><text fill="#13243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="bold" text-anchor="start" x="97" y="233">ARDUINO UNO R3</text><text fill="#586B81" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" x="97" y="263">Sensores HC-SR04 a 5 V + pantalla LCD 5 V</text><text fill="#13243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" x="105" y="291">S1: TRIG D4  | ECHO D5     (entrada)</text><text fill="#13243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" x="105" y="325">S2: TRIG D6  | ECHO D7     (plaza 1)</text><text fill="#13243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" x="105" y="359">S3: TRIG D8  | ECHO D9     (plaza 2)</text><text fill="#13243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" x="105" y="393">S4: TRIG D10 | ECHO D11   (plaza 3)</text><rect fill="white" height="251" rx="18" stroke="#DDE4EC" stroke-width="2" width="828" x="1150" y="192" /><rect fill="#2C8A91" height="251" rx="4" width="8" x="1150" y="192" /><text fill="#13243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="bold" text-anchor="start" x="1177" y="233">ESP32 WROOM-32 — DEVKIT</text><text fill="#586B81" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" x="1177" y="263">Servo, LED y Wi-Fi / API local</text><text fill="#13243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" x="1185" y="291">RX UART: GPIO16  &lt;= UNO D12 (1200 baud)</text><text fill="#13243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" x="1185" y="325">SERVO: GPIO18 (senal 3.3 V)</text><text fill="#13243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" x="1185" y="359">LED P1: verde 25, rojo 26  | P2: 27, 32</text><text fill="#13243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" x="1185" y="393">LED P3: verde 33, rojo 23</text><line stroke="#2C8A91" stroke-linecap="round" stroke-width="7" x1="915" x2="1143" y1="290" y2="290" /><text fill="#13243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" x="1030" y="264">D12  →  G16</text><text fill="#2C8A91" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="1030" y="322">Pull-up 4.7 kΩ</text><rect fill="white" height="374" rx="18" stroke="#DDE4EC" stroke-width="2" width="840" x="70" y="495" /><rect fill="#236BB4" height="374" rx="4" width="8" x="70" y="495" /><text fill="#13243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="bold" text-anchor="start" x="97" y="536">CONEXIONES AL UNO</text><text fill="#586B81" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" x="97" y="566">Cada sensor: VCC = UNO 5V, GND = UNO GND</text><text fill="#13243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start" x="105" y="600">HC-SR04 1  →  TRIG D4   | ECHO D5</text><text fill="#13243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start" x="105" y="638">HC-SR04 2  →  TRIG D6   | ECHO D7</text><text fill="#13243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start" x="105" y="676">HC-SR04 3  →  TRIG D8   | ECHO D9</text><text fill="#13243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start" x="105" y="714">HC-SR04 4  →  TRIG D10 | ECHO D11</text><text fill="#13243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start" x="105" y="752">LCD I2C      →  SDA A4 | SCL A5</text><text fill="#13243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start" x="105" y="790">LCD I2C      →  VCC 5V | GND GND</text><text fill="#13243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start" x="105" y="828">UNO D12      →  ESP32 GPIO16 (UART RX)</text><rect fill="white" height="374" rx="18" stroke="#DDE4EC" stroke-width="2" width="828" x="1150" y="495" /><rect fill="#2C8A91" height="374" rx="4" width="8" x="1150" y="495" /><text fill="#13243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="bold" text-anchor="start" x="1177" y="536">CONEXIONES AL ESP32</text><text fill="#586B81" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" x="1177" y="566">CADA LED: resistencia 330 Ω en serie</text><text fill="#13243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="start" x="1183" y="600">Plaza 1    GPIO25 → 330Ω → LED VERDE (+)</text><text fill="#13243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="start" x="1183" y="638">             GPIO26 → 330Ω → LED ROJO (+)</text><text fill="#13243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="start" x="1183" y="676">Plaza 2    GPIO27 → 330Ω → LED VERDE (+)</text><text fill="#13243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="start" x="1183" y="714">             GPIO32 → 330Ω → LED ROJO (+)</text><text fill="#13243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="start" x="1183" y="752">Plaza 3    GPIO33 → 330Ω → LED VERDE (+)</text><text fill="#13243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="start" x="1183" y="790">             GPIO23 → 330Ω → LED ROJO (+)</text><text fill="#13243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="start" x="1183" y="828">Los 6 catodos (-) de LED → GND comun</text><line stroke="#236BB4" stroke-linecap="round" stroke-width="4" x1="485" x2="485" y1="443" y2="492" /><line stroke="#2C8A91" stroke-linecap="round" stroke-width="4" x1="1560" x2="1560" y1="443" y2="492" /><rect fill="white" height="281" rx="18" stroke="#DDE4EC" stroke-width="2" width="840" x="70" y="911" /><rect fill="#D18025" height="281" rx="4" width="8" x="70" y="911" /><text fill="#13243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="bold" text-anchor="start" x="97" y="952">FUENTE DE ALIMENTACION</text><text fill="#586B81" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" x="97" y="982">5 V regulados, capacidad recomendada ≥ 2 A</text><text fill="#13243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="start" x="105" y="1008">FUENTE +5 V → SERVO rojo (VCC)</text><text fill="#13243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="start" x="105" y="1047">FUENTE GND  → SERVO marron (GND)</text><text fill="#13243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="start" x="105" y="1086">GND fuente  → GND ESP32 y GND UNO</text><text fill="#13243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="start" x="105" y="1125">NO conectar positivo fuente a pines GPIO</text><text fill="#13243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="start" x="105" y="1164">UNO y ESP32: por USB propios</text><rect fill="white" height="281" rx="18" stroke="#DDE4EC" stroke-width="2" width="828" x="1150" y="911" /><rect fill="#D18025" height="281" rx="4" width="8" x="1150" y="911" /><text fill="#13243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="bold" text-anchor="start" x="1177" y="952">SERVO SG90 Y BARRERA</text><text fill="#586B81" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" x="1177" y="982">Servo con alimentacion externa y tierra compartida</text><text fill="#13243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="start" x="1182" y="1008">Servo naranja/amarillo → ESP32 GPIO18</text><text fill="#13243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="start" x="1182" y="1047">Servo rojo              → fuente externa +5 V</text><text fill="#13243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="start" x="1182" y="1086">Servo marron/negro     → GND fuente</text><text fill="#13243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="start" x="1182" y="1125">1100 μs = cerrado  | 1900 μs = abierto</text><text fill="#13243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="start" x="1182" y="1164">Ajustar posiciones segun el mecanismo</text><line stroke="#D18025" stroke-linecap="round" stroke-width="7" x1="905" x2="1144" y1="1040" y2="1040" /><text fill="#D18025" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" x="1026" y="1013">GND COMUN</text><rect fill="#E4EDF4" height="146" rx="17" width="1908" x="70" y="1250" /><text fill="#CB4545" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="start" x="100" y="1295">CRITICO</text><text fill="#13243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" x="245" y="1295">NO usar salida HIGH de 5 V del UNO hacia GPIO16. D12 debe trabajar en modo abierto (0 V / alta impedancia).</text><text fill="#13243B" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" x="100" y="1345">El ESP32 es de logica 3.3 V. Los ECHO del HC-SR04 permanecen conectados SOLO al UNO de 5 V.</text></svg>